name: tofu-vocab-local
services:
    database:
        image: postgres:16
        environment:
            POSTGRES_USER: demo
            POSTGRES_PASSWORD: local-demo-only
            POSTGRES_DB: tofu_vocab
        ports:
            - '127.0.0.1:5193:5432'
        volumes:
            - vocab-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U demo -d tofu_vocab']
            interval: 2s
            timeout: 3s
            retries: 20
volumes:
    vocab-data:
